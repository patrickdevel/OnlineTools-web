<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OniineTools - 8-Bit & 4-Bit Audio Converter</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --accent-pink: #ff0055;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .drop-zone {
            border: 2px dashed var(--accent-green);
            border-radius: 6px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(0, 255, 102, 0.02);
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(0, 255, 102, 0.08);
            border-color: var(--accent-cyan);
        }

        .drop-zone p {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .drop-zone span {
            display: block;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input[type="file"] {
            display: none;
        }

        .controls {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        select, input[type="range"] {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .val-display {
            font-size: 0.8rem;
            color: var(--accent-green);
            text-align: right;
        }

        .visualizer-container {
            margin-top: 25px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 120px;
            display: block;
        }

        .action-buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: var(--accent-cyan);
        }

        button:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        #btnDownload {
            background: var(--accent-pink);
            color: #fff;
        }

        #btnDownload:hover:not(:disabled) {
            background: #ff3377;
        }

        .file-info {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--accent-green);
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>OniineTools</h1>
        <p>80s Retro Arcade Sound & 4-Bit Chiptune Audio Converter</p>
    </header>

    <div class="container">
        <div class="drop-zone" id="dropZone">
            <p>🎵 Audio-Datei hierher ziehen oder klicken</p>
            <span>Unterstützt MP3, WAV, OGG, FLAC</span>
            <input type="file" id="fileInput" accept="audio/*">
        </div>

        <div class="file-info" id="fileInfo"></div>

        <div class="controls">
            <div class="control-group">
                <label for="bitDepth">Bit-Tiefe (Quantisierung):</label>
                <select id="bitDepth">
                    <option value="2">2-Bit (Extreme Glitch)</option>
                    <option value="4" selected>4-Bit (Classic 80s Chip)</option>
                    <option value="8">8-Bit (Retro Console)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="sampleRate">Sample-Rate Reduction:</label>
                <input type="range" id="sampleRate" min="1" max="10" value="4" step="1">
                <div class="val-display" id="sampleRateVal">4x Downsampling</div>
            </div>

            <div class="control-group">
                <label for="mode">Soundchip-Mode:</label>
                <select id="mode">
                    <option value="square">Square Wave Emulation (Arcade)</option>
                    <option value="bitcrush" selected>Clean Bitcrush + Aliasing</option>
                </select>
            </div>
        </div>

        <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
        </div>

        <div class="action-buttons">
            <button id="btnProcess" disabled>Konvertieren</button>
            <button id="btnPlay" disabled>► Abspielen</button>
            <button id="btnDownload" disabled>💾 WAV Herunterladen</button>
        </div>
    </div>

    <script>
        let audioCtx;
        let originalBuffer = null;
        let processedBuffer = null;
        let currentSource = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const btnProcess = document.getElementById('btnProcess');
        const btnPlay = document.getElementById('btnPlay');
        const btnDownload = document.getElementById('btnDownload');
        const sampleRateInput = document.getElementById('sampleRate');
        const sampleRateVal = document.getElementById('sampleRateVal');
        const bitDepthSelect = document.getElementById('bitDepth');
        const modeSelect = document.getElementById('mode');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // Canvas Setup
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // File Selection Handlers
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) loadFile(e.target.files[0]);
        });

        sampleRateInput.addEventListener('input', (e) => {
            sampleRateVal.textContent = `${e.target.value}x Downsampling`;
        });

        function loadFile(file) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const reader = new FileReader();
            
            fileInfo.style.display = 'block';
            fileInfo.textContent = `Lade Datei: ${file.name}...`;

            reader.onload = function(e) {
                audioCtx.decodeAudioData(e.target.result, (buffer) => {
                    originalBuffer = buffer;
                    fileInfo.textContent = `Geladen: ${file.name} | Dauer: ${buffer.duration.toFixed(1)}s | ${buffer.sampleRate}Hz`;
                    btnProcess.disabled = false;
                    btnPlay.disabled = true;
                    btnDownload.disabled = true;
                }, () => {
                    fileInfo.textContent = 'Fehler beim Decodieren der Audiodatei!';
                });
            };
            reader.readAsArrayBuffer(file);
        }

        // Core 4-Bit & 80s Sound Engine Processing
        btnProcess.addEventListener('click', () => {
            if (!originalBuffer) return;

            const bits = parseInt(bitDepthSelect.value);
            const downsampleFactor = parseInt(sampleRateInput.value);
            const isSquareMode = modeSelect.value === 'square';

            const numChannels = originalBuffer.numberOfChannels;
            const length = originalBuffer.length;
            const sampleRate = originalBuffer.sampleRate;

            processedBuffer = audioCtx.createBuffer(numChannels, length, sampleRate);

            const stepCount = Math.pow(2, bits); // 4-bit = 16 levels

            for (let channel = 0; channel < numChannels; channel++) {
                const inputData = originalBuffer.getChannelData(channel);
                const outputData = processedBuffer.getChannelData(channel);
                let lastSample = 0;

                for (let i = 0; i < length; i++) {
                    // Downsampling (Hold sample)
                    if (i % downsampleFactor === 0) {
                        let sample = inputData[i];
                        
                        if (isSquareMode) {
                            // Convert sound into classic 80s arcade square wave pulse
                            sample = sample > 0 ? 0.8 : -0.8;
                        } else {
                            // 4-Bit Quantization
                            sample = Math.floor((sample + 1) / 2 * stepCount) / stepCount * 2 - 1;
                        }

                        lastSample = sample;
                    }
                    outputData[i] = lastSample;
                }
            }

            fileInfo.textContent = `Erfolgreich konvertiert! (Modus: ${bits}-Bit, ${downsampleFactor}x Downsampling)`;
            btnPlay.disabled = false;
            btnDownload.disabled = false;
            drawWaveform(processedBuffer.getChannelData(0));
        });

        // Audio Playback
        btnPlay.addEventListener('click', () => {
            if (!processedBuffer) return;

            if (currentSource) {
                currentSource.stop();
                currentSource = null;
                btnPlay.textContent = '► Abspielen';
                return;
            }

            currentSource = audioCtx.createBufferSource();
            currentSource.buffer = processedBuffer;

            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            currentSource.connect(analyser);
            analyser.connect(audioCtx.destination);

            currentSource.start();
            btnPlay.textContent = '█ Stoppen';

            currentSource.onended = () => {
                btnPlay.textContent = '► Abspielen';
                currentSource = null;
            };

            // Live Visualizer loop
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                if (!currentSource) return;
                requestAnimationFrame(draw);

                analyser.getByteTimeDomainData(dataArray);
                canvasCtx.fillStyle = '#000';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = '#00ff66';
                canvasCtx.beginPath();

                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;

                    if (i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                }

                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();
            }
            draw();
        });

        // Static Waveform Drawing
        function drawWaveform(data) {
            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 1;
            canvasCtx.strokeStyle = '#00e5ff';
            canvasCtx.beginPath();

            const step = Math.ceil(data.length / canvas.width);
            const amp = canvas.height / 2;

            for (let i = 0; i < canvas.width; i++) {
                let min = 1.0;
                let max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                canvasCtx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
            }
        }

        // Export to WAV File
        btnDownload.addEventListener('click', () => {
            if (!processedBuffer) return;

            const wavBuffer = bufferToWav(processedBuffer);
            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `oniinetools_4bit_${Date.now()}.wav`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Helper: AudioBuffer to PCM WAV Format
        function bufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            let result;
            if (numChannels === 2) {
                result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
            } else {
                result = buffer.getChannelData(0);
            }

            return createWavFile(result, numChannels, sampleRate, bitDepth);
        }

        function interleave(inputL, inputR) {
            const length = inputL.length + inputR.length;
            const result = new Float32Array(length);
            let index = 0;
            let inputIndex = 0;

            while (index < length) {
                result[index++] = inputL[inputIndex];
                result[index++] = inputR[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function createWavFile(samples, numChannels, sampleRate, bitDepth) {
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const buffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
            const view = new DataView(buffer);

            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* RIFF chunk length */
            view.setUint32(4, 36 + samples.length * bytesPerSample, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* format chunk length */
            view.setUint32(16, 16, true);
            /* sample format (raw) */
            view.setUint16(20, 1, true);
            /* channel count */
            view.setUint16(22, numChannels, true);
            /* sample rate */
            view.setUint32(24, sampleRate, true);
            /* byte rate (sample rate * block align) */
            view.setUint32(28, sampleRate * blockAlign, true);
            /* block align */
            view.setUint16(32, blockAlign, true);
            /* bits per sample */
            view.setUint16(34, bitDepth, true);
            /* data chunk identifier */
            writeString(view, 36, 'data');
            /* data chunk length */
            view.setUint32(40, samples.length * bytesPerSample, true);

            // Write PCM samples
            let offset = 44;
            for (let i = 0; i < samples.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }

            return buffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
</body>
</html>
