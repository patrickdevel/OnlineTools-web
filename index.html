<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OniineTools — Bass Booster</title>
    <style>
        :root {
            --bg: #09090b;
            --card: #121215;
            --border: #222226;
            --text-primary: #f4f4f5;
            --text-secondary: #71717a;
            --accent: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .main-container {
            width: 100%;
            max-width: 540px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        header {
            margin-bottom: 28px;
            text-align: left;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .drop-zone {
            border: 1px dashed #333338;
            border-radius: 12px;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.01);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--text-primary);
            background: var(--accent-glow);
        }

        .drop-zone-text {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .drop-zone-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        input[type="file"] {
            display: none;
        }

        .file-status {
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: none;
            word-break: break-all;
        }

        .controls-grid {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
        }

        .control-label {
            color: var(--text-primary);
            font-weight: 500;
        }

        .control-value {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #222228;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .visualizer-box {
            margin-top: 28px;
            height: 60px;
            width: 100%;
            background: #000000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .btn-group {
            margin-top: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: var(--text-primary);
            color: var(--bg);
            border: none;
            padding: 12px 18px;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background: #222226;
            color: #44444c;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.04);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>OniineTools</h1>
            <p>Minimalist Audio Bass Booster</p>
        </header>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-text">Audio-Datei auswählen oder hierher ziehen</div>
            <div class="drop-zone-sub">MP3, WAV, FLAC, M4A, OGG</div>
            <input type="file" id="fileInput" accept="audio/*">
        </div>

        <div class="file-status" id="fileStatus"></div>

        <div class="controls-grid">
            <div class="control-row">
                <div class="control-header">
                    <span class="control-label">Bass Boost</span>
                    <span class="control-value" id="valBoost">+12 dB</span>
                </div>
                <input type="range" id="sliderBoost" min="0" max="24" value="12" step="0.5">
            </div>

            <div class="control-row">
                <div class="control-header">
                    <span class="control-label">Frequenz (Cutoff)</span>
                    <span class="control-value" id="valFreq">100 Hz</span>
                </div>
                <input type="range" id="sliderFreq" min="40" max="220" value="100" step="5">
            </div>

            <div class="control-row">
                <div class="control-header">
                    <span class="control-label">Lautstärke (Gain)</span>
                    <span class="control-value" id="valGain">100%</span>
                </div>
                <input type="range" id="sliderGain" min="0" max="150" value="100" step="1">
            </div>
        </div>

        <div class="visualizer-box">
            <canvas id="visualizer"></canvas>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" id="btnPlay" disabled>Abspielen</button>
            <button id="btnDownload" disabled>WAV Exportieren</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let originalBuffer = null;
        let sourceNode = null;
        let bassFilter = null;
        let gainNode = null;
        let analyserNode = null;
        let isPlaying = false;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        
        const sliderBoost = document.getElementById('sliderBoost');
        const sliderFreq = document.getElementById('sliderFreq');
        const sliderGain = document.getElementById('sliderGain');
        
        const valBoost = document.getElementById('valBoost');
        const valFreq = document.getElementById('valFreq');
        const valGain = document.getElementById('valGain');

        const btnPlay = document.getElementById('btnPlay');
        const btnDownload = document.getElementById('btnDownload');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // Drag & Drop Handlers
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        // Dynamic Slider Updates
        sliderBoost.addEventListener('input', (e) => {
            valBoost.textContent = `+${e.target.value} dB`;
            if (bassFilter) bassFilter.gain.value = parseFloat(e.target.value);
        });

        sliderFreq.addEventListener('input', (e) => {
            valFreq.textContent = `${e.target.value} Hz`;
            if (bassFilter) bassFilter.frequency.value = parseFloat(e.target.value);
        });

        sliderGain.addEventListener('input', (e) => {
            valGain.textContent = `${e.target.value}%`;
            if (gainNode) gainNode.gain.value = parseFloat(e.target.value) / 100;
        });

        // Load Audio File
        function handleFile(file) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            fileStatus.style.display = 'block';
            fileStatus.textContent = `Lade ${file.name}...`;

            const reader = new FileReader();
            reader.onload = function(e) {
                audioCtx.decodeAudioData(e.target.result, (buffer) => {
                    originalBuffer = buffer;
                    fileStatus.textContent = `${file.name} (${buffer.duration.toFixed(1)}s)`;
                    btnPlay.disabled = false;
                    btnDownload.disabled = false;
                }, () => {
                    fileStatus.textContent = 'Fehler beim Laden der Audiodatei.';
                });
            };
            reader.readAsArrayBuffer(file);
        }

        // Setup Web Audio Graph
        function setupAudioGraph() {
            if (!audioCtx || !originalBuffer) return;

            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = originalBuffer;

            // Lowshelf Filter for Bass Boost
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = parseFloat(sliderFreq.value);
            bassFilter.gain.value = parseFloat(sliderBoost.value);

            // Volume Gain Node
            gainNode = audioCtx.createGain();
            gainNode.gain.value = parseFloat(sliderGain.value) / 100;

            // Analyser for Visualization
            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 128;

            // Soft Limiter to avoid severe clipping
            const compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -1.0;
            compressor.knee.value = 0.0;
            compressor.ratio.value = 20.0;
            compressor.attack.value = 0.005;
            compressor.release.value = 0.050;

            // Connect Nodes
            sourceNode.connect(bassFilter);
            bassFilter.connect(gainNode);
            gainNode.connect(compressor);
            compressor.connect(analyserNode);
            analyserNode.connect(audioCtx.destination);
        }

        // Play / Pause Logic
        btnPlay.addEventListener('click', () => {
            if (isPlaying) {
                if (sourceNode) sourceNode.stop();
                isPlaying = false;
                btnPlay.textContent = 'Abspielen';
            } else {
                setupAudioGraph();
                sourceNode.start();
                isPlaying = true;
                btnPlay.textContent = 'Stoppen';

                sourceNode.onended = () => {
                    isPlaying = false;
                    btnPlay.textContent = 'Abspielen';
                };

                renderVisualizer();
            }
        });

        // Minimalist Visualizer
        function renderVisualizer() {
            if (!isPlaying || !analyserNode) return;
            requestAnimationFrame(renderVisualizer);

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyserNode.getByteFrequencyData(dataArray);

            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            canvasCtx.fillStyle = '#000000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 1.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                canvasCtx.fillStyle = '#ffffff';
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        // Export Processed Audio to WAV
        btnDownload.addEventListener('click', async () => {
            if (!originalBuffer) return;

            btnDownload.disabled = true;
            btnDownload.textContent = 'Berechne...';

            const offlineCtx = new OfflineAudioContext(
                originalBuffer.numberOfChannels,
                originalBuffer.length,
                originalBuffer.sampleRate
            );

            const offlineSource = offlineCtx.createBufferSource();
            offlineSource.buffer = originalBuffer;

            const offlineFilter = offlineCtx.createBiquadFilter();
            offlineFilter.type = 'lowshelf';
            offlineFilter.frequency.value = parseFloat(sliderFreq.value);
            offlineFilter.gain.value = parseFloat(sliderBoost.value);

            const offlineGain = offlineCtx.createGain();
            offlineGain.gain.value = parseFloat(sliderGain.value) / 100;

            const offlineCompressor = offlineCtx.createDynamicsCompressor();
            offlineCompressor.threshold.value = -1.0;
            offlineCompressor.knee.value = 0.0;
            offlineCompressor.ratio.value = 20.0;

            offlineSource.connect(offlineFilter);
            offlineFilter.connect(offlineGain);
            offlineGain.connect(offlineCompressor);
            offlineCompressor.connect(offlineCtx.destination);

            offlineSource.start();

            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = audioBufferToWav(renderedBuffer);

            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `oniinetools_bassboosted_${Date.now()}.wav`;
            a.click();
            URL.revokeObjectURL(url);

            btnDownload.disabled = false;
            btnDownload.textContent = 'WAV Exportieren';
        });

        // Helper: Convert AudioBuffer to WAV File Blob
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            let result;
            if (numChannels === 2) {
                result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
            } else {
                result = buffer.getChannelData(0);
            }

            const dataView = encodeWAV(result, numChannels, sampleRate, bitDepth);
            return new Blob([dataView], { type: 'audio/wav' });
        }

        function interleave(inputL, inputR) {
            const length = inputL.length + inputR.length;
            const result = new Float32Array(length);
            let index = 0, inputIndex = 0;

            while (index < length) {
                result[index++] = inputL[inputIndex];
                result[index++] = inputR[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function encodeWAV(samples, numChannels, sampleRate, bitDepth) {
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const buffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
            const view = new DataView(buffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + samples.length * bytesPerSample, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, samples.length * bytesPerSample, true);

            let offset = 44;
            for (let i = 0; i < samples.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }

            return view;
        }
    </script>
</body>
</html>
